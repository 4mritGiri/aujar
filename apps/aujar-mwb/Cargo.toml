[package]
name = "aujar-mwb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Mouse Borders agent: share one keyboard and mouse between Linux, macOS and Windows machines"

[[bin]]
name = "aujar-mwb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aujar-config = { workspace = true }
aujar-core = { workspace = true }
aujar-mouse-borders = { workspace = true }
aujar-mwb-cli = { workspace = true }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
