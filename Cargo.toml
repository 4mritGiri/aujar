[workspace]
resolver = "2"

members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-platform",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "crates/aujar-runtime",
    "apps/aujar-launcher",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/color",
    "modules/ruler",
    "modules/rename",
]

default-members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-platform",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "apps/aujar-launcher",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/color",
    "modules/ruler",
    "modules/rename",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Aujar Contributors"]
repository = "https://github.com/4mritGiri/aujar"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
    "process",
] }

toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
