[workspace]
resolver = "2"

members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-platform",
    "crates/aujar-hotkeys",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "crates/aujar-runtime",
    "apps/aujar-launcher",
    # The GPUI launcher UI is a member (so `cargo run -p aujar-ui --release` works) but NOT a
    # default member: plain `cargo build` / `cargo check` skip it and need no GPU or
    # windowing libraries. CI and `just check` pass `--exclude aujar-ui` for `--workspace`.
    # Never build it together with the daemon in ONE cargo command: `ashpd` is used with the
    # tokio runtime by the daemon and with async-io by GPUI, and the features would unify.
    "apps/aujar-ui",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/color",
    "modules/ruler",
    "modules/rename",
]

default-members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-platform",
    "crates/aujar-hotkeys",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "apps/aujar-launcher",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/color",
    "modules/ruler",
    "modules/rename",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Aujar Contributors"]
repository = "https://github.com/4mritGiri/aujar"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
    "process",
] }

toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
