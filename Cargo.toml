[workspace]
resolver = "2"

# NexDesk lives in its own workspace (git submodule, see docs/NEXDESK.md); Aujar never builds it.
exclude = ["integrations/nexdesk"]

members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-mwb-cli",
    "crates/aujar-platform",
    "crates/aujar-hotkeys",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "crates/aujar-runtime",
    "apps/aujar-launcher",
    "apps/aujar-mwb",
    # The GPUI launcher UI is a member (so `cargo run -p aujar-ui --release` works) but NOT a
    # default member: plain `cargo build` / `cargo check` skip it and need no GPU or
    # windowing libraries. CI still passes `--exclude aujar-ui` so platform jobs stay light.
    "apps/aujar-ui",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/awake",
    "modules/color",
    "modules/image-resizer",
    "modules/ruler",
    "modules/rename",
    "modules/mouse-borders",
    "modules/nexdesk",
]

default-members = [
    "crates/aujar-core",
    "crates/aujar-config",
    "crates/aujar-ipc",
    "crates/aujar-mwb-cli",
    "crates/aujar-platform",
    "crates/aujar-hotkeys",
    "crates/aujar-daemon",
    "crates/aujar-plugin",
    "apps/aujar-launcher",
    "apps/aujar-mwb",
    "modules/launcher",
    "modules/window",
    "modules/zones",
    "modules/clipboard",
    "modules/awake",
    "modules/color",
    "modules/image-resizer",
    "modules/ruler",
    "modules/rename",
    "modules/mouse-borders",
    "modules/nexdesk",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Aujar Contributors"]
repository = "https://github.com/4mritGiri/aujar"

[workspace.dependencies]
anyhow = "1"
# Prefer ashpd's async-io backend (not tokio) so feature unification with GPUI succeeds.
# ashpd refuses to enable both runtimes at once.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25.10", default-features = true }

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
    "process",
] }

toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Internal path crates. Version is required so cargo-deny `wildcards = "deny"` accepts them.
aujar-awake = { path = "modules/awake", version = "0.1.1" }
aujar-color = { path = "modules/color", version = "0.1.1" }
aujar-config = { path = "crates/aujar-config", version = "0.1.1" }
aujar-core = { path = "crates/aujar-core", version = "0.1.1" }
aujar-daemon = { path = "crates/aujar-daemon", version = "0.1.1" }
aujar-hotkeys = { path = "crates/aujar-hotkeys", version = "0.1.1" }
aujar-image-resizer = { path = "modules/image-resizer", version = "0.1.1" }
aujar-ipc = { path = "crates/aujar-ipc", version = "0.1.1" }
aujar-launcher = { path = "modules/launcher", version = "0.1.1" }
aujar-mouse-borders = { path = "modules/mouse-borders", version = "0.1.1" }
aujar-mwb-cli = { path = "crates/aujar-mwb-cli", version = "0.1.1" }
aujar-nexdesk = { path = "modules/nexdesk", version = "0.1.1" }
aujar-platform = { path = "crates/aujar-platform", version = "0.1.1" }
aujar-rename = { path = "modules/rename", version = "0.1.1" }
aujar-runtime = { path = "crates/aujar-runtime", version = "0.1.1" }

# ---- build profiles (see docs/DEVELOPMENT.md, "Faster builds") ------------------------------
# Debug builds are what `cargo test`, `cargo run` and the editor use all day. Two changes keep
# them quick without giving up the debugger:
#   * line tables instead of full debug info: backtraces, panics and breakpoints on lines still
#     work, but object files are much smaller and linking is faster. Need to inspect local
#     variables? Run with `CARGO_PROFILE_DEV_DEBUG=full cargo run ...` (or edit this line).
#   * unpacked debuginfo: the linker does not have to merge it into the binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Full debug info for the debugger (Zed's "Debug: ..." configurations in .zed/debug.json build
# with this profile). It has its own directory, target/debugging, so switching between running
# and debugging never rebuilds the other one. The first debugging build compiles everything
# once (slow for aujar-ui); after that it is incremental.
[profile.debugging]
inherits = "dev"
debug = true

# Unoptimized image codecs and cryptography are painfully slow (resizing a photo, the Noise
# handshake in the Mouse Borders tests). Optimize only those dependencies: the first build
# costs a little more, every run afterwards is much faster, and Aujar's own crates still
# compile quickly and keep their debug assertions. Packages that are not in the dependency
# graph are simply ignored.
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.zune-core]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
[profile.dev.package.gif]
opt-level = 2
[profile.dev.package.tiff]
opt-level = 2
[profile.dev.package.image-webp]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.snow]
opt-level = 2
[profile.dev.package.chacha20]
opt-level = 2
[profile.dev.package.poly1305]
opt-level = 2
[profile.dev.package.chacha20poly1305]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2

# Dependencies' build scripts and proc macros run on every build: optimizing them is free speed.
[profile.dev.build-override]
opt-level = 1
