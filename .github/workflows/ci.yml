name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude aujar-ui --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.container }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:24.04, fedora:latest, archlinux:latest]
    steps:
      - name: Install build prerequisites
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y curl build-essential git;
          elif command -v dnf >/dev/null; then dnf install -y curl gcc git;
          else pacman -Sy --noconfirm curl base-devel git; fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --exclude aujar-ui

  # Mouse Borders runs on Linux, macOS and Windows. These are the crates that build there; the
  # rest of Aujar (launcher, UI, daemon) is Linux-only. Windows and macOS backends were
  # type-checked and unit-tested but never run on real hardware before this job existed:
  # a failure here is a real finding, not noise.
  cross-platform:
    name: mouse-borders (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aujar-config -p aujar-mouse-borders -p aujar-mwb-cli -p aujar-mwb
      - run: cargo build --release -p aujar-mwb
      - uses: actions/upload-artifact@v4
        with:
          name: aujar-mwb-${{ matrix.os }}
          path: |
            target/release/aujar-mwb
            target/release/aujar-mwb.exe
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --exclude aujar-ui

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: package (deb + rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release -p aujar-launcher-app
      - run: cargo deb -p aujar-launcher-app --no-build
      - run: cargo generate-rpm -p apps/aujar-launcher
      - name: Inspect packages
        run: |
          sudo apt-get install -y rpm
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          rpm -qpi target/generate-rpm/*.rpm
          rpm -qpl target/generate-rpm/*.rpm
      - name: Install the deb
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          aujar --help
          test -f /usr/lib/systemd/user/aujar.service
          test -f /usr/share/applications/dev.aujar.Aujar.desktop

