name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 4"
  workflow_dispatch:

# The analysis job needs this permission to publish findings. All other token
# permissions remain read-only, including for pull requests from forks.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'rust' && 'manual' || 'none' }}
          queries: security-extended

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      # Building explicitly gives CodeQL complete Rust dependency and generated-code context.
      - name: Build Rust workspace
        if: matrix.language == 'rust'
        run: cargo check --workspace --exclude aujar-ui

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
