name: Commits

# Every commit in a pull request follows CONTRIBUTING.md: Conventional Commits and a DCO
# sign-off (git commit -s). Bot commits (Dependabot) are skipped. Contributors get the same check
# locally from the commit-msg hook (scripts/install-hooks.sh); this catches clones without it.

on:
  pull_request:

permissions:
  contents: read

jobs:
  messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-pr-commits.sh "$BASE" "$HEAD"
