name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='aujar-launcher-app'))")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - run: cargo build --release --locked -p aujar-launcher-app

      - name: Build packages
        run: |
          mkdir dist
          cargo deb -p aujar-launcher-app --no-build --output dist/
          cargo generate-rpm -p apps/aujar-launcher --output dist/

          name="aujar-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/aujar LICENSE README.md config/policy.example.toml \
             packaging/systemd/aujar.service packaging/desktop/dev.aujar.Aujar.desktop \
             scripts/install-local.sh "$name/"
          tar -czf "dist/${name}.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
