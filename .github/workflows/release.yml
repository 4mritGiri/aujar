name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  linux:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='aujar-launcher-app'))")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - run: cargo build --release --locked -p aujar-launcher-app

      - name: Build packages
        run: |
          mkdir dist
          cargo deb -p aujar-launcher-app --no-build --output dist/
          cargo generate-rpm -p apps/aujar-launcher --output dist/

          name="aujar-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/aujar LICENSE README.md config/policy.example.toml \
             packaging/systemd/aujar.service packaging/desktop/dev.aujar.Aujar.desktop \
             scripts/install-local.sh "$name/"
          tar -czf "dist/${name}.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  # The desktop launcher/daemon is Linux-only.  Mouse Borders has native input
  # backends for all three desktop platforms, so ship it as a self-contained
  # archive on macOS and Windows.  This deliberately builds on each native
  # runner instead of cross-compiling system APIs.
  mouse-borders:
    name: mouse-borders (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
          - { runner: macos-13, platform: macos, arch: x86_64 }
          - { runner: macos-14, platform: macos, arch: aarch64 }
          - { runner: windows-latest, platform: windows, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(cargo pkgid -p aujar-mwb | sed 's/.*#//')
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }

      - name: Build Mouse Borders
        run: cargo build --release --locked -p aujar-mwb

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="aujar-mwb-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp target/release/aujar-mwb LICENSE config/mouse-borders.example.toml \
            packaging/mwb/README.md "dist/${name}/"
          (cd dist && tar -czf "${name}.tar.gz" "$name")

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "aujar-mwb-$env:GITHUB_REF_NAME-windows-x86_64"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/aujar-mwb.exe, LICENSE, config/mouse-borders.example.toml, packaging/mwb/README.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mwb-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  # NexDesk, the remote-access suite pinned as a submodule (integrations/nexdesk), built with its
  # own packaging so `aujar nexdesk open` and `rdp <name>` have something to start. Its version
  # is its own, not Aujar's, so the files carry NexDesk's version number.
  nexdesk:
    name: nexdesk (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/nexdesk -> target

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake \
            libpipewire-0.3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libfontconfig1-dev \
            libvulkan-dev libssl-dev libzstd-dev

      - name: Build and package the pinned NexDesk
        working-directory: integrations/nexdesk
        run: |
          set -euo pipefail
          cargo build --release --locked -p nexdesk -p nexdesk-rdp

          mkdir -p "$GITHUB_WORKSPACE/dist"
          OUT_DIR="$GITHUB_WORKSPACE/dist" packaging/make-deb.sh

          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="nexdesk-${version}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/nexdesk target/release/nexdesk-rdp \
             packaging/nexdesk.desktop packaging/nexdesk.svg \
             LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar -czf "$GITHUB_WORKSPACE/dist/${name}.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: nexdesk-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [linux, mouse-borders, nexdesk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
