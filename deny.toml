# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

# The GPUI UI (and its large dependency tree) is audited separately; see docs/adr/0002.
[graph]
exclude = ["aujar-ui"]
[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
