# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

# The GPUI UI (and its large dependency tree) is audited separately.
# See docs/adr/0002.

[graph]
exclude = ["aujar-ui"]

[advisories]
version = 2
ignore = [
    # ashpd 0.13 currently depends on zbus 5 / zvariant 5. The advisory documents that this is
    # an upstream maintenance migration, with no safe upgrade available in that release line.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
