# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

# The GPUI UI (and its large dependency tree) is audited separately.
# See docs/adr/0002.

[graph]
exclude = ["aujar-ui"]

[advisories]
version = 2
ignore = [
    # ashpd 0.13 currently depends on zbus 5 / zvariant 5. The advisory documents that this is
    # an upstream maintenance migration, with no safe upgrade available in that release line.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
    # zbus_names is "unmaintained" only because it was merged into zbus 6.0 (its `names` module).
    # It reaches us through ashpd 0.13 -> zbus 5, the same upstream migration as above, and no
    # upgrade exists in that release line. Not a vulnerability. Drop once ashpd moves to zbus 6.
    "RUSTSEC-2026-0371",
    # paste is archived by its author (unmaintained, not vulnerable); no safe upgrade exists.
    # It comes in through the `image` crate's AVIF (rav1e) and OpenEXR (exr -> pulp) support.
    # Gone if those `image` features are turned off, or when image/exr move to `pastey`.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
