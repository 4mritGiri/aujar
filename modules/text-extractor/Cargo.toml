[package]
name = "aujar-text-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Text Extractor: select part of the screen and copy the text in it (OCR with Tesseract)"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aujar-runtime = { workspace = true }
image.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's screenshot portal, with its own area selection (GNOME, KDE).
ashpd = { workspace = true, features = ["screenshot"] }

[dev-dependencies]
tempfile = "3"
