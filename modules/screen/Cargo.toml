[package]
name = "aujar-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Screen capture, monitor layout and window positions on Linux, Windows and macOS"

[dependencies]
anyhow.workspace = true
image.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's screenshot portal (GNOME, KDE).
ashpd = { workspace = true, features = ["screenshot"] }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }

[dev-dependencies]
tempfile = "3"
